4px; border-left: 4px solid var(--blue); }\n.note.a { background: var(--amber-soft); border-color: var(--amber); } .note.r { background: var(--red-soft); border-color: var(--red); } .note.v { background: var(--pri-soft); border-color: var(--pri); }\n\n/* ---------- formulaires ---------- */\nlabel.f { display: flex; flex-direction: column; gap: 5px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }\nlabel.f.req > span::after { content: \" *\"; color: var(--red); }\ninput, select, textarea { font: inherit; font-size: 15px; color: var(--ink); background: var(--surf); border: 1px solid var(--line-2); border-radius: 9px; padding: 9px 11px; min-height: 42px; width: 100%; }\ntextarea { min-height: 80px; resize: vertical; }\ninput:focus, select:focus, textarea:focus { border-color: var(--pri); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--pri) 20%, transparent); }\ninput[type=checkbox] { width: 20px; height: 20px; min-height: 0; accent-color: var(--pri); }\nlabel.chk { display: flex; align-items: center; gap: 10px; font-weight: 500; color: var(--ink); cursor: pointer; }\n.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }\n.form .full { grid-column: 1 / -1; }\n.help { font-weight: 400; font-size: 12.5px; color: var(--ink-3); }\n.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }\n.filters > * { flex: 1 1 160px; max-width: 260px; }\n.filters .grow { flex: 2 1 240px; max-width: 420px; }\n.seg { display: inline-flex; background: var(--surf-2); border: 1px solid var(--line); border-radius: 11px; padding: 3px; flex-wrap: wrap; }\n.seg button { border: 0; background: none; font: inherit; font-weight: 600; font-size: 14px; color: var(--ink-2); padding: 7px 13px; border-radius: 8px; cursor: pointer; }\n.seg button.on { background: var(--surf); color: var(--ink); box-shadow: var(--shadow); }\n.totalbar { position: sticky; bottom: 0; margin: 18px -20px -20px; padding: 14p ont-size: 12.5px; }\n.kpi.v b { color: var(--pri); } .kpi.r b { color: var(--red); }\n.fins { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; margin-bottom: 20px; }\n.fin { background: var(--surf); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px 20px; }\n.fin h3 { font-size: 16px; margin-bottom: 2px; }\n.fin .who { font-size: 13px; color: var(--ink-3); margin-bottom: 14px; }\n/* trajectoire : barre de consommation + rep\u00e8re du temps \u00e9coul\u00e9 */\n.traj { position: relative; height: 16px; border-radius: 99px; background: var(--surf-2); border: 1px solid var(--line); margin: 26px 0 8px; }\n.traj .fill { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--pri); max-width: 100%; }\n.traj.avance .fill { background: var(--amber); } .traj.depasse .fill { background: var(--red); } .traj.retard .fill { background: var(--blue); }\n.traj .now { position: absolute; top: -9px; bottom: -9px; width: 2px; background: var(--ink); border-radius: 2px; }\n.traj .now::after { content: attr(data-l); position: absolute; bottom: calc(100% + 2px); left: 50%; transform: translateX(-50%); font-size: 11.5px; color: var(--ink-2); white-space: nowrap; font-weight: 600; }\n.traj .now.end::after { left: auto; right: -2px; transform: none; } .traj .now.start::after { left: -2px; transform: none; }\n.traj-l { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink-3); }\n.fin dl { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 12px; margin: 14px 0 0; }\n.fin dt { font-size: 12px; color: var(--ink-3); } .fin dd { margin: 0; font-weight: 650; font-size: 15px; }\n.alerts { list-style: none; padding: 0; margin: 0; }\n.alerts li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; cursor: pointer; }\n.alerts li:last-child { border-bottom: 0; }\n.alerts .dot { width: 10px; height: 10px; bord   /* Lecture : renvoie { nomFeuille: [[cellules]] } */
  async function read(buf) {

<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">

<fill><patternFill patternType="solid"><fgColor rgb="FFEAF4EF"/></patternFill></fill></fills>

<cellXfs count="5"><xf/><xf fontId="1" fillId="2" applyFont="1" applyFill="1"><alignment wrapText="1" vertical="center"/></xf>

<xf fontId="0" fillId="4" applyFill="1"/><xf numFmtId="3" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;

    const ct = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`;

/* EFA Gestion — noyau : données, sécurité, rôles, sauvegarde, synchronisation */
(function () {
  const APP_VERSION = '1.0.0';
  const COLLECTIONS = ['entites', 'comptes', 'financements', 'rubriques', 'mouvements', 'fournisseurs', 'budget', 'missions',
    'inventaire', 'stockMvts', 'membres', 'cotisations', 'demandes', 'ressources', 'users', 'audit', 'conflits'];

  /* ---------- utilitaires ---------- */
  const U = {
    id() { return (crypto.randomUUID ? crypto.randomUUID() : 'id' + Date.now() + Math.random().toString(16).slice(2)).replace(/-/g, '').slice(0, 20); },
    now() { return new Date().toISOString(); },
    today() { return U.iso(new Date()); },
    iso(d) { const z = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; },

    fmtDateTime(s) { if (!s) return ''; const d = new Date(s); return d.toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }); },
    num(v) { if (typeof v === 'number') return v; if (v === null || v === undefined || v === '') return 0; const n = parseFloat(String(v).replace(/\s/g, '').replace(',', '.')); return isNaN(n) ? 0 : n; },

    n0(v) { return U.num(v).toLocaleString('fr-FR', { maximumFractionDigits: 0 }); },
    usd(v) { return U.num(v).toLocaleString('fr-FR', { maximumFractionDigits: 2 }) + ' $'; },
    pct(v) { return (isFinite(v) ? v : 0).toLocaleString('fr-FR', { maximumFractionDigits: 1 }) + ' %'; },
    esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
    clone(o) { return JSON.parse(JSON.stringify(o)); },
    download(blob, name) {
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;

    /* ---------- fenêtres ---------- */

      const m = { el: bg, val: n => { const e = bg.querySelector(`[name="${n}"]`); if (!e) return ''; return e.type === 'checkbox' ? e.checked : e.value.trim(); }, close: () => { bg.remove(); o.onClose && o.onClose(); } };

    /* ---------- formulaires ---------- */
    field(f, v) {

      if (f.type === 'area') return `<label class="${cls}"><span>${f.label}</span><textarea name="${f.k}"${req}${dis}>${U.esc(val)}</textarea>${help}</label>`;
      if (f.type === 'file') return `<label class="${cls}"><span>${f.label}</span><input type="file" name="${f.k}" accept="${f.accept || ''}">${help}</label>`;
      const list = f.list ? ` list="dl-${f.k}"` : '', dl = f.list ? `<datalist id="dl-${f.k}">${(typeof f.list === 'function' ? f.list() : f.list).map(o => `<option value="${U.esc(o)}">`).join('')}</datalist>` : '';
      return `<label class="${cls}"><span>${f.label}</span><input name="${f.k}" type="${f.type || 'text'}" value="${U.esc(val)}"${f.type === 'number' ? ' step="any" inputmode="decimal"' : ''}${req}${dis}${list}>${dl}${help}</label>`;
    },
    form(fields, rec = {}) { return `<div class="form">${fields.map(f => f.html ? `<div class="${f.full ? 'full' : ''}">${f.html}</div>` : App.field(f, rec[f.k])).join('')}</div>`; },
    read(fields, m) { const o = {}; for (const f of fields) { if (!f.k || f.type === 'file' || f.dis) continue; let v = m.val(f.k); if (f.type === 'number') v = U.num(v); o[f.k] = v; } return o; },
    checkReq(fields, m) { const miss = fields.filter(f => f.req && !f.dis && (m.val(f.k) === '' || m.val(f.k) === undefined)).map(f => f.label); if (miss.length) { App.toast('À remplir : ' + miss.join(', '), true); return false; } return true; },
    fileData(input, maxMb = 3) { return new Promise((res, rej) => { const f = input.files?.[0]; if (!f) return res(null); if (f.size > maxMb * 1048576) return rej(new Error(`Fichier trop lourd (max ${maxMb} Mo).`)); const r = new FileReader(); r.onload = () => res({ nom: f.name, type: f.type, data: r.result, date: U.now() }); r.onerror = () => rej(r.error); r.readAsDataURL(f); }); },

    /* ---------- tableaux ---------- */

    /* ---------- graphiques ---------- */
    lineChart(labels, series, h = 220) {
      if (!labels.length) return '<div class="empty">Pas encore de données sur cette période.</div>';
      const W = 640, L = 64, B = 26, T = 10, max = Math.max(1, ...series.flatMap(s => s.values)), n = labels.length;
      const x = i => L + (n === 1 ? (W - L) / 2 : i * (W - L - 10) / (n - 1)), y = v => T + (h - T - B) * (1 - v / max);
      const grid = [0, .25, .5, .75, 1].map(g => `<line x1="${L}" x2="${W}" y1="${y(max * g)}" y2="${y(max * g)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(max * g) + 4}" text-anchor="end">${App.short(max * g)}</text>`).join('');
      const step = Math.ceil(n / 8), xl = labels.map((l, i) => i % step === 0 || i === n - 1 ? `<text x="${x(i)}" y="${h - 6}" text-anchor="middle">${U.esc(l)}</text>` : '').join('');

      return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="Graphique">${grid}${xl}${lines}</svg><div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${s.name}</span>`).join('')}</div>`;
    },
    barsV(labels, series, h = 220) {
      if (!labels.length) return '<div class="empty">Pas encore de données sur cette période.</div>';
      const W = 640, L = 64, B = 26, T = 10, max = Math.max(1, ...series.flatMap(s => s.values)), n = labels.length, gw = (W - L) / n, bw = Math.min(26, gw / (series.length + 1));
      const y = v => T + (h - T - B) * (1 - v / max);
      const grid = [0, .5, 1].map(g => `<line x1="${L}" x2="${W}" y1="${y(max * g)}" y2="${y(max * g)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(max * g) + 4}" text-anchor="end">${App.short(max * g)}</text>`).join('');
      const step = Math.ceil(n / 10);
      const bars = labels.map((l, i) => series.map((s, j) => { const v = s.values[i] || 0, x0 = L + i * gw + (gw - bw * series.length) / 2 + j * bw; return `<rect x="${x0}" y="${y(v)}" width="${bw - 2}" height="${Math.max(0, h - B - y(v))}" rx="3" fill="${s.color}"><title>${U.esc(l)} — ${s.name} : ${U.ar(v)}</title></rect>`; }).join('') + (i % step === 0 ? `<text x="${L + i * gw + gw / 2}" y="${h - 6}" text-anchor="middle">${U.esc(l)}</text>` : '')).join('');

    },
    hbars(items, total) {
      if (!items.length) return '<div class="empty">Aucune dépense sur cette période.</div>';
      const max = Math.max(...items.map(i => i.v));
      return items.map(i => `<div class="hbar"><span class="lab" title="${U.esc(i.l)}">${U.esc(i.l)}</span><span class="b"><i style="width:${(i.v / max * 100).toFixed(1)}%;${i.c ? `background:${i.c}` : ''}"></i></span><b class="num">${U.ar(i.v)}${total ? ` <span class="muted small">${U.pct(i.v / total * 100)}</span>` : ''}</b></div>`).join('');
    },
    short(v) { v = Math.round(v); if (Math.abs(v) >= 1e9) return (v / 1e9).toFixed(1).replace('.0', '') + ' Md'; if (Math.abs(v) >= 1e6) return (v / 1e6).toFixed(1).replace('.0', '') + ' M'; if (Math.abs(v) >= 1e3) return Math.round(v / 1e3) + ' k'; return String(v); },
    traj(st) {

    /* ---------- écran générique liste + fiche ---------- */

          <div class="row" style="flex:0 0 auto;max-width:none">${canEdit && o.fields ? `<button class="btn pri" id="add">${ic('plus')}${o.addLabel || 'Ajouter'}</button>` : ''}<button class="btn" id="xl" title="Exporter en Excel">${ic('excel')}Excel</button><button class="btn" id="pr" title="Imprimer en PDF A4">${ic('print')}PDF</button></div></div>
          ${o.top ? o.top(rows) : ''}${App.table(o.cols, rows, { id: o.coll, click: true, empty: o.empty, emptyHint: o.emptyHint, foot: o.foot && o.foot(rows) })}`;
        const q = $('#q', c); q.oninput = () => { st.q = q.value; clearTimeout(App._qt); App._qt = setTimeout(() => { render(); const n = $('#q', c); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); };

        App.bindTable(c, rows, { click: r => o.open ? o.open(r, edit, render) : edit(r), rerender: render });

          ok: ro ? null : 'Enregistrer', cancel: ro ? 'Fermer' : 'Annuler',

          onOpen: m => { const d = m.el.querySelector('[data-del]'); if (d) d.onclick = async () => { if (await App.confirm('Supprimer', 'Supprimer cet élément ? Il restera visible dans le journal d\'audit.', 'Supprimer', true)) { if (o.onDelete) o.onDelete(rec); else DB.remove(o.coll, rec.id); m.close(); App.toast('Supprimé.'); render(); } }; o.onOpen && o.onOpen(m, rec); },
          onOk: async m => {

    /* ---------- aides partagées ---------- */
    fournisseurAuto(nom) {

    },
    async userFromMembre(m) {
      const un = String(m.username).trim().toLowerCase(); if (!un || DB.list('users').some(u => u.username.toLowerCase() === un)) return false;
      if (!EFA.ROLES[m.role] || m.role === 'superadmin') return false;

    // Budget prévisionnel

    bl('F-PROJ', 'PROJECT ADMINISTRATION', 'PROJECT ADMINISTRATION', 'Salaires', 'Équipe projet (12 mois)', 11, 4800000, false);
    bl('F-PROJ', 'PROJECT ADMINISTRATION', 'PROJECT ADMINISTRATION', 'Frais bancaires', 'Frais mensuels', 12, 40000, false);

    bl('F-PROJ', 'FIELD', 'FIELD', 'Carburant', 'Gasoil par mission', 10, 600000, false);

    bl('F-PROJ', 'CONSUMABLE, REAGENTS AND RELATED', 'CONSUMABLE, REAGENTS AND RELATED', 'Consommables', 'Glace carbonique et tubes', 6, 1500000, true);
    bl('F-ETU', 'BOURSES', 'PROJECT ADMINISTRATION', 'Bourses', 'Allocation mensuelle', 8, 5200000, false);
    bl('F-LAB', 'LABORATORY', 'LABORATORY', 'Consommables et réactifs', 'Mensuel', 12, 1700000, true);
    bl('F-LAB', 'ADMINISTRATION', 'ADMINISTRATION', 'Électricité et internet', 'Mensuel', 12, 380000, false);
    bl('F-ASSO', 'ADMINISTRATION', 'ADMINISTRATION', 'Fonctionnement', 'Fournitures et communication', 12, 200000, false);
    bl('F-ASSO', 'ACTIVITES DE L ASSOCIATION', 'ACTIVITES DE L ASSOCIATION', 'Activités', 'Réunions et sensibilisation', 12, 300000, false);
    // Inventaire du laboratoire
    var inv = [['EQUIPMENT AND FIXED ASSETS', 'SALLE 1', 'Centrifugeuse', 'Marque A', 1, 'unité', '', 0], ['EQUIPMENT AND FIXED ASSETS', 'SALLE 1', 'Agitateur vortex', 'Marque B', 2, 'unités', '', 0], ['CONSUMABLES', 'SALLE 2', 'Tubes cryogéniques 1,5 ml', '', 850, 'pièces', off(400), 200],
      ['CONSUMABLES', 'SALLE 2', 'Gants nitrile taille M', '', 6, 'boîtes', off(500), 10], ['REAGENTS', 'SALLE 3', 'Éthanol 70 %', '', 12, 'litres', off(18), 5], ['REAGENTS', 'SALLE 3', 'Tampon PBS', '', 4, 'flacons', off(-5), 2],
      ['CONSUMABLES', 'SALLE 2', 'Pointes de pipette 200 µl', '', 3200, 'pièces', '', 1000], ['EQUIPMENT AND FIXED ASSETS', 'SALLE 3', 'Congélateur -80 °C', 'Marque C', 1, 'unité', '', 0]];
    inv.forEach(function (x, i) { S.inventaire.push({ id: id('in'), categorie: x[0], salle: x[1], numero: String(i + 1), designation: x[2], marque: x[3], caracteristique: '', quantite: x[4], unite: x[5], provenance: pick(['EFA', 'DONS']), etat: 'Bon', dateAchat: '', peremption: x[6], valeur: 0, stockMin: x[7] }); });
    // Demandes de dépense
    var dem = function (objet, rub, srub, fin, ent, mt, statut, who) { var h = [{ date: new Date(Date.now() - 3 * 864e5).toISOString(), user: who, action: 'Demande envoyée', note: '' }]; if (statut !== 'Soumise') h.push({ date: new Date(Date.now() - 2 * 864e5).toISOString(), user: 'raf', action: 'Validée', note: '' }); S.demandes.push({ id: id('dem'), objet: objet, date: off(-3), entite: ent, financement: fin, rubrique: rub, sousRubrique: srub, beneficiaire: '', montant: mt, motif: 'Démonstration du circuit de validation', statut: statut, historique: h, createdBy: who }); };

    dem('Impression des rapports trimestriels', 'ADMINISTRATION', 'FOURNITURES DE BUREAU', 'F-ASSO', 'ASSO', 180000, 'Soumise', 'demandeur');
    dem('Avance carburant mission Montagne d\'Ambre', 'FIELD', 'CARBURANT', 'F-PROJ', 'PROJ', 900000, 'Validée', 'demandeur');
    // Membres et cotisations
    [['RAKOTO', 'Hery', 'Président'], ['RABE', 'Lalao', 'Trésorière'], ['RANDRIA', 'Tojo', 'Secrétaire'], ['RAVELO', 'Mamy', 'Membre'], ['RASOA', 'Fara', 'Membre'], ['RAZAFY', 'Naina', 'Membre']].forEach(function (x, i) {

      S.membres.push(mb);
      if (i < 4) S.cotisations.push({ id: id('co'), membre: mb.id, annee: Y, date: dt(rint(1, Math.max(1, M)), rint(2, 26)), montant: 20000 });

  }

  var D = EFA.DB, load = D.load.bind(D);
  D.load = async function () {
    var r = await load(), S = EFA.S, st = S.data.settings;
    if (!st.installe) {
      Object.assign(st, { nom: 'Association de démonstration', sigle: 'EFA', adresse: 'Antananarivo, Madagascar', nif: '0000000000', stat: '00000 00 0000 0 00000', tel: '034 00 000 00', email: '', installe: true, autoLogout: 0 });
      var sa = S.data.users.find(function (u) { return u.id === 'superadmin'; });
      if (sa) { sa.mustChange = false; sa.skipQuestions = true; }
      var extra = [['raf', 'Responsable financier (démo)', 'raf'], ['caissier', 'Caissier (démo)', 'caissier'], ['demandeur', 'Agent de saisie (démo)', 'demandeur']];
      for (var i = 0; i < extra.length; i++) {
        var salt = EFA.Sec.salt();
        S.data.users.push({ id: 'demo-' + extra[i][0], username: extra[i][0], nom: extra[i][1], email: '', role: extra[i][2], entites: [], financements: [], salt: salt, hash: await EFA.Sec.hash('demo1234', salt), questions: [], mustChange: false, skipQuestions: true, actif: true, createdAt: EFA.U.now(), updatedAt: EFA.U.now() });
      }
      var seed = buildSeed();
      window.EFA_SEED = seed;
      App.loadSeed(false);
      ['ressources', 'demandes', 'membres', 'cotisations'].forEach(function (c) { seed[c].forEach(function (x) { S.data[c].push(Object.assign({}, x, { createdAt: EFA.U.now(), updatedAt: EFA.U.now() })); }); });
      S.data.audit = [];
      await D.saveNow();
    }
    return r;
  };
  App.logout = function () { window.DEMO_LOGOUT(); };
  window.DEMO_FILL = function (u, p) { var f = document.getElementById('lf'); if (!f) return; f.querySelector('[name=u]').value = u; f.querySelector('[name=p]').value = p; f.querySelector('[name=p]').focus(); };
})();

</script>
<script>
/* Bandeau « Démo » : identifiants de test, remplissage automatique et remise à zéro. */
(function () {
  var C = window.__DEMO || {};
  var host = document.createElement('div');
  host.id = 'ampandrana-demo-bar';
  var POS_OPEN = 'position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom, 0px));z-index:2147483000;width:max-content;max-width:calc(100vw - 24px)';
  var POS_MIN = 'position:fixed;left:50%;top:calc(6px + env(safe-area-inset-top, 0px));transform:translateX(-50%);z-index:2147483000;width:max-content;max-width:calc(100vw - 24px)';
  host.setAttribute('style', POS_OPEN);
  var root = host.attachShadow ? host.attachShadow({ mode: 'open' }) : host;
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var accounts = (C.accounts || []).map(function (a, i) {
    return '<li><div class="who"><b>' + esc(a.label) + '</b><span>' + esc(a.userLabel || 'Identifiant') + ' <code>' + esc(a.user) + '</code>' + (a.pass ? ' · ' + esc(a.passLabel || 'Mot de passe') + ' <code>' + esc(a.pass) + '</code>' : '') + '</span></div>' +
      (C.canFill && a.pass ? '<button type="button" data-fill="' + i + '">Utiliser</button>' : '') + '</li>';
  }).join('');
  root.innerHTML = '<style>' +
    ':host{all:initial}*{box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}' +
    '.bar{background:#10162B;color:#F2F4FA;border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);overflow:hidden}' +
    '.head{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px}' +
    '.back{color:#F2F4FA;text-decoration:none;font-weight:700;font-size:13px;padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.1);white-space:nowrap}.back:hover{background:rgba(255,255,255,.18)}' +
    '.tag{background:#F47B0F;color:#1A0E02;font-weight:800;font-size:11px;letter-spacing:.08em;padding:3px 8px;border-radius:999px}' +
    '.title{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}' +
    'button{font:inherit;cursor:pointer;border-radius:10px;min-height:34px;padding:0 12px;font-size:13px;font-weight:700}' +
    '.tog{background:rgba(255,255,255,.1);color:#F2F4FA;border:0;margin-left:auto}' +
    '.body{padding:0 14px 14px;display:grid;gap:10px;max-width:440px}' +
    'ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}' +
    'li{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border-radius:12px;padding:8px 10px}' +
    '.who{display:grid;gap:2px;min-width:0;flex:1;font-size:12.5px;color:#C9D1E8}.who b{color:#fff;font-size:13px}' +
    'code{font-family:ui-monospace,Menlo,monospace;background:rgba(244,123,15,.18);color:#FFD2A8;padding:1px 6px;border-radius:6px;font-size:12.5px}' +
    'li button{background:#F47B0F;color:#1A0E02;border:0}' +
    'p{margin:0;font-size:12.5px;line-height:1.45;color:#C9D1E8}' +
    '.reset{background:transparent;color:#FFB4A8;border:1px solid rgba(255,180,168,.4);justify-self:start}' +
    'button:focus-visible{outline:2px solid #F47B0F;outline-offset:2px}' +
    '</style>' +
    '<div class="bar"><div class="head">' + (C.back ? '<a class="back" href="' + esc(C.back) + '">← Portfolio</a>' : '') + '<span class="tag">DÉMO</span><span class="title">' + esc(C.title || 'Version de démonstration') + '</span><button type="button" class="tog" aria-expanded="true">Réduire</button></div>' +
    '<div class="body"><p>' + esc(C.hint || 'Connectez-vous avec un compte de test.') + '</p><ul>' + accounts + '</ul>' +
    '<p>Tout ce que vous saisissez est effacé dès que vous vous déconnectez.</p>' +
    '<button type="button" class="reset">Effacer mes saisies et recommencer</button></div></div>';
  var body = root.querySelector('.body'), tog = root.querySelector('.tog');
  var title = root.querySelector('.title');
  var setOpen = function (open) { body.hidden = !open; body.style.display = open ? '' : 'none'; title.style.display = open ? '' : 'none'; tog.textContent = open ? 'Réduire' : 'Comptes de test'; tog.setAttribute('aria-expanded', String(open)); host.setAttribute('style', open ? POS_OPEN : POS_MIN); };
  tog.onclick = function (e) { e.stopPropagation(); setOpen(body.hidden); };
  /* Dès que le visiteur utilise le logiciel, le bandeau se range en haut de l'écran. */
  document.addEventListener('pointerdown', function (e) { if (!body.hidden && e.target !== host) setOpen(false); }, true);
  root.querySelector('.reset').onclick = function () { window.DEMO_LOGOUT(); };
  Array.prototype.forEach.call(root.querySelectorAll('[data-fill]'), function (b) {
    b.onclick = function () { var a = C.accounts[+b.dataset.fill]; try { window.DEMO_FILL && window.DEMO_FILL(a.user, a.pass); } catch (e) {} setOpen(false); };
  });
  var add = function () { document.body.appendChild(host); };
  if (document.body) add(); else document.addEventListener('DOMContentLoaded', add);
  /* L'application peut remplacer tout le contenu de la page : on remet le bandeau en place. */
  setInterval(function () { if (!host.isConnected && document.body) add(); }, 600);
})();

</script>
