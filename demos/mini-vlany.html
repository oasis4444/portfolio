<style>:root{--side:#0E3326;--side-fg:#DDEFE5;--acc:#1F9D57;--acc-ink:#fff;--bg:#F4F6F5;--surf:#fff;--ink:#14201A;--mut:#5F6E66;--line:#E2E8E4;--soft:#EAF4EE;--red:#C2362B;--amber:#A35F08;--blue:#1D5FD0;color-scheme:light}

        addLabel: 'Nouveau client',
        cols: [{ k: 'nom', label: 'Nom', req: 1 }, { k: 'tel', label: 'Téléphone' }, { k: 'piece', label: 'Pièce d\'identité' }, { k: 'sejours', label: 'Séjours', type: 'num', calc: function (r, DB) { return DB.reservations.filter(function (x) { return x.client === r.nom; }).length; } }],
        seed: function () { return ['Rakoto Hery', 'Rasoa Fara', 'M. Dupont', 'Randria Tojo', 'Ravelo Mamy'].map(function (n, i) { return { nom: n, tel: '034 00 000 ' + (30 + i), piece: 'CIN n° 1010000' + (10 + i) }; }); }
      }
    },
    kpis: function (DB, H) {
      var occ = DB.chambres.filter(function (c) { return c.statut === 'Occupée'; }).length, arr = DB.reservations.filter(function (r) { return r.arrivee === H.today() && r.statut !== 'Annulée'; }).length;
      var men = DB.chambres.filter(function (c) { return c.statut === 'À nettoyer'; }).length;
      return [{ label: 'Taux d\'occupation', value: Math.round(occ / DB.chambres.length * 100) + ' %', sub: occ + ' chambres sur ' + DB.chambres.length, tone: 'up' }, { label: 'Arrivées du jour', value: String(arr) }, { label: 'Encaissé aujourd\'hui', value: H.money(H.sum(DB.paiements.filter(function (p) { return p.date === H.today(); }), 'montant')) }, { label: 'Chambres à nettoyer', value: String(men), tone: men ? 'warn' : '' }];
    },
    chart: function (DB, H) { return { title: 'Encaissements des 7 derniers jours', short: function (v) { return Math.round(v / 1000) + ' k'; }, points: H.last7(DB.paiements, 'date', 'montant') }; },
    lists: function (DB) { return [{ title: 'État des chambres', rows: DB.chambres.map(function (c) { return ['Chambre ' + c.numero, c.type + ' · ' + c.prix.toLocaleString('fr-FR') + ' Ar', c.statut, { Libre: 'ok', 'Réservée': 'info', 'Occupée': 'warn', 'À nettoyer': 'bad' }[c.statut]]; }) }, { title: 'Réservations à confirmer', empty: 'Aucune réservation en attente.', rows: DB.reservations.filter(function (r) { return r.statut === 'En attente'; }).map(function (r) { return [r.client, 'Chambre ' + r.chambre + ' · ' + r.formule, 'En attente', 'warn']; }) }]; }
  };
  /* Le menu Ménage montre les chambres, filtrées et triées par état. */
  CONFIGS.trano.tables.chambres_menage = Object.assign({}, CONFIGS.trano.tables.chambres, { addLabel: 'Nouvelle chambre', intro: 'Ouvrez une chambre à nettoyer et passez-la à « Libre » une fois prête.', src: 'chambres', sort: function (a, b) { return (a.statut === 'À nettoyer' ? 0 : 1) - (b.statut === 'À nettoyer' ? 0 : 1); } });
})();

<script>
/* Mini-logiciel de démonstration : connexion, menus, tableau de bord, ajout / modification / suppression.
   Les données vivent dans ce navigateur et sont effacées à la déconnexion. */
(function () {
  var C = window.APP, KEY = 'mini_' + C.id, DB, user = null, page = C.menu[0].id, q = '';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var fmt = function (n) { return Math.round(+n || 0).toLocaleString('fr-FR').replace(/[  ]/g, ' '); };
  var money = function (n) { return fmt(n) + ' ' + (C.cur || 'Ar'); };
  var iso = function (d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  var R = DEMO_RNG(C.seed || 7);
  var H = {
    d: function (off) { var x = new Date(); x.setDate(x.getDate() + off); return iso(x); },
    today: function () { return iso(new Date()); },
    month: function () { return iso(new Date()).slice(0, 7); },
    int: function (a, b) { return a + Math.floor(R() * (b - a + 1)); },
    pick: function (a) { return a[Math.floor(R() * a.length)]; },
    fmt: fmt, money: money,
    find: function (t, k, v) { return (DB[t] || []).find(function (r) { return r[k] === v; }); },
    sum: function (rows, k) { return rows.reduce(function (a, r) { return a + (+r[k] || 0); }, 0); },
    last7: function (rows, dateK, valK) {
      var out = []; for (var i = 6; i >= 0; i--) { var d = H.d(-i); out.push({ l: new Date(d + 'T12:00').toLocaleDateString('fr-FR', { weekday: 'short' }).replace('.', ''), v: H.sum(rows.filter(function (r) { return r[dateK] === d; }), valK) }); }
      return out;
    }
  };
  var K = function (tk) { return C.tables[tk].src || tk; };
  function load() {
    try { DB = JSON.parse(localStorage.getItem(KEY)); } catch (e) { DB = null; }
    if (!DB) { DB = {}; Object.keys(C.tables).filter(function (k) { return !C.tables[k].src; }).forEach(function (k) { DB[k] = C.tables[k].seed(H).map(function (r, i) { r.id = k + '-' + i; return r; }); }); save(); }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {} }
  function toast(t, err) { var e = document.createElement('div'); e.className = 'toast' + (err ? ' err' : ''); e.textContent = t; document.body.appendChild(e); setTimeout(function () { e.remove(); }, 2600); }

  /* ---------- connexion ---------- */
  function renderLogin(err) {
    document.getElementById('app').innerHTML =
      '<div class="login"><form class="lcard" id="lf" novalidate><div class="lhead"><span class="mark">' + esc(C.initial) + '</span><div><b>' + esc(C.app) + '</b><small>' + esc(C.sub) + '</small></div></div>' +
      '<h1>Connexion</h1><p class="muted">' + esc(C.welcome || 'Entrez votre identifiant et votre mot de passe.') + '</p>' +
      (err ? '<div class="note err">' + esc(err) + '</div>' : '') +
      '<label for="lu">Identifiant</label><input id="lu" autocomplete="username" autocapitalize="none">' +
      '<label for="lp">Mot de passe</label><input id="lp" type="password" autocomplete="current-password">' +
      '<button class="btn pri wide" type="submit">Se connecter</button></form></div>';
    $('#lf').onsubmit = function (e) {
      e.preventDefault();
      var u = $('#lu').value.trim().toLowerCase(), p = $('#lp').value;
      var acc = C.users.find(function (x) { return x.u === u && x.p === p; });
      if (!acc) return renderLogin('Identifiant ou mot de passe incorrect.');
      user = acc; page = C.menu[0].id; renderShell();
    };
    setTimeout(function () { var i = $('#lu'); if (i) i.focus(); }, 30);
  }
  window.DEMO_FILL = function (u, p) { var a = $('#lu'), b = $('#lp'); if (a && b) { a.value = u; b.value = p; b.focus(); } };

  /* ---------- cadre ---------- */
  function renderShell() {
    var m = C.menu.find(function (x) { return x.id === page; }), t = m.table && C.tables[m.table];
    document.getElementById('app').innerHTML =
      '<div class="shell"><aside class="side"><div class="brand"><span class="mark">' + esc(C.initial) + '</span><div><b>' + esc(C.app) + '</b><small>' + esc(C.sub) + '</small></div></div>' +
      '<nav class="nav">' + C.menu.map(function (x) { var n = x.badge ? x.badge(DB, H) : 0; return '<button type="button" data-p="' + x.id + '" class="' + (x.id === page ? 'on' : '') + '"><span>' + esc(x.label) + '</span>' + (n ? '<i>' + n + '</i>' : '') + '</button>'; }).join('') + '</nav>' +
      '<div class="me"><span class="av">' + esc(user.name[0]) + '</span><div><b>' + esc(user.name) + '</b><small>' + esc(user.role) + '</small></div><button type="button" class="out" id="logout" title="Se déconnecter" aria-label="Se déconnecter"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button></div></aside>' +
      '<main class="main"><header class="top"><div><small class="muted">' + esc(m.hello ? m.hello(user) : (C.app + ' · ' + new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }))) + '</small><h2>' + esc(m.label) + '</h2></div><span class="sp"></span>' +
      (t ? '<input class="search" id="q" placeholder="Rechercher…" value="' + esc(q) + '" aria-label="Rechercher"><button class="btn pri" type="button" id="add">+ ' + esc(t.addLabel || 'Ajouter') + '</button>' : '<button class="btn pri" type="button" id="quick">+ ' + esc(C.quick.label) + '</button>') +
      '</header><div class="content" id="content"></div></main></div>';
    document.querySelectorAll('[data-p]').forEach(function (b) { b.onclick = function () { page = b.dataset.p; q = ''; renderShell(); window.scrollTo(0, 0); }; });
    $('#logout').onclick = function () { window.DEMO_LOGOUT(); };
    if (t) {
      $('#add').onclick = function () { form(m.table, null); };
      $('#q').oninput = function (e) { q = e.target.value; renderTable(m.table); var i = $('#q'); i.focus(); };
      renderTable(m.table);
    } else {
      $('#quick').onclick = function () { form(C.quick.table, null); };
      renderDash();
    }
  }

  /* ---------- tableau de bord ---------- */
  function renderDash() {
    var k = C.kpis(DB, H), ch = C.chart(DB, H), lists = C.lists(DB, H);
    var max = Math.max.apply(null, ch.points.map(function (p) { return p.v; }).concat([1]));
    $('#content').innerHTML =
      '<div class="kpis">' + k.map(function (x) { return '<div class="kpi"><span>' + esc(x.label) + '</span><b class="' + (x.tone || '') + '">' + esc(x.value) + '</b>' + (x.sub ? '<small>' + esc(x.sub) + '</small>' : '') + '</div>'; }).join('') + '</div>' +
      '<div class="grid2"><section class="card"><h3>' + esc(ch.title) + '</h3><div class="bars">' + ch.points.map(function (p, i) {
        return '<div class="bar"><em>' + esc(ch.short ? ch.short(p.v) : fmt(p.v)) + '</em><span style="height:' + Math.max(2, Math.round(p.v / max * 100)) + '%" class="' + (i === ch.points.length - 1 ? 'hl' : '') + '"></span><small>' + esc(p.l) + '</small></div>';
      }).join('') + '</div></section>' +
      lists.map(function (l) { return '<section class="card"><h3>' + esc(l.title) + '</h3>' + (l.rows.length ? '<ul class="list">' + l.rows.map(function (r) { return '<li><div><b>' + esc(r[0]) + '</b><small>' + esc(r[1] || '') + '</small></div><span class="chip ' + (r[3] || '') + '">' + esc(r[2]) + '</span></li>'; }).join('') + '</ul>' : '<p class="muted">' + esc(l.empty || 'Rien à signaler.') + '</p>') + '</section>'; }).join('') + '</div>';
  }

  /* ---------- listes ---------- */
  function cell(c, r) {
    var v = c.calc ? c.calc(r, DB, H) : r[c.k];
    if (c.type === 'money') return money(v);
    if (c.type === 'num') return fmt(v);
    if (c.type === 'date') return v ? new Date(v + 'T12:00').toLocaleDateString('fr-FR') : '—';
    if (c.badge) return '<span class="chip ' + (c.badge[v] || '') + '">' + esc(v) + '</span>';
    return esc(v);
  }
  function renderTable(tk) {
    var t = C.tables[tk], rows = DB[K(tk)].slice();
    if (t.sort) rows.sort(t.sort);
    if (q) { var s = q.toLowerCase(); rows = rows.filter(function (r) { return JSON.stringify(r).toLowerCase().indexOf(s) >= 0; }); }
    var cols = t.cols.filter(function (c) { return !c.hide; });
    var foot = t.total ? '<tfoot><tr><td colspan="' + (cols.length - 1) + '">Total (' + rows.length + ')</td><td class="n">' + money(H.sum(rows.map(function (r) { return { v: t.total(r) }; }), 'v')) + '</td></tr></tfoot>' : '';
    $('#content').innerHTML = (t.intro ? '<p class="muted intro">' + esc(t.intro) + '</p>' : '') +
      '<div class="tw"><table><thead><tr>' + cols.map(function (c) { return '<th class="' + (c.type === 'money' || c.type === 'num' ? 'n' : '') + '">' + esc(c.label) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      (rows.length ? rows.map(function (r) { return '<tr data-id="' + r.id + '" tabindex="0">' + cols.map(function (c) { return '<td data-l="' + esc(c.label) + '" class="' + (c.type === 'money' || c.type === 'num' ? 'n' : '') + '">' + cell(c, r) + '</td>'; }).join('') + '</tr>'; }).join('') : '<tr><td colspan="' + cols.length + '" class="empty">Aucun élément. Cliquez sur « ' + esc(t.addLabel || 'Ajouter') + ' ».</td></tr>') +
      '</tbody>' + foot + '</table></div><p class="muted hint">Cliquez sur une ligne pour la modifier ou la supprimer.</p>';
    document.querySelectorAll('tr[data-id]').forEach(function (tr) {
      var open = function () { form(tk, DB[K(tk)].find(function (r) { return r.id === tr.dataset.id; })); };
      tr.onclick = open; tr.onkeydown = function (e) { if (e.key === 'Enter') open(); };
    });
  }

  /* ---------- formulaire ---------- */
  function form(tk, rec) {
    var t = C.tables[tk], isNew = !rec, r = rec ? JSON.parse(JSON.stringify(rec)) : (t.defaults ? t.defaults(DB, H) : {});
    var fields = t.cols.filter(function (c) { return !c.calc; });
    var bg = document.createElement('div'); bg.className = 'mbg';
    bg.innerHTML = '<form class="modal" novalidate><header><h3>' + esc(isNew ? (t.addLabel || 'Ajouter') : 'Modifier : ' + (r[fields[0].k] || '')) + '</h3><button type="button" class="x" aria-label="Fermer">×</button></header><div class="fbody">' +
      fields.map(function (c) {
        var v = r[c.k] == null ? '' : r[c.k], id = 'f_' + c.k;
        var opts = typeof c.opts === 'function' ? c.opts(DB, H) : c.opts;
        var input = opts ? '<select id="' + id + '">' + opts.map(function (o) { return '<option ' + (String(o) === String(v) ? 'selected' : '') + '>' + esc(o) + '</option>'; }).join('') + '</select>'
          : '<input id="' + id + '" type="' + (c.type === 'date' ? 'date' : (c.type === 'money' || c.type === 'num') ? 'number' : 'text') + '" ' + (c.type === 'money' || c.type === 'num' ? 'step="any" inputmode="decimal"' : '') + ' value="' + esc(v) + '">';
        return '<label for="' + id + '">' + esc(c.label) + (c.req ? ' *' : '') + '</label>' + input + (c.help ? '<small class="muted">' + esc(c.help) + '</small>' : '');
      }).join('') + '</div><footer>' + (!isNew ? '<button type="button" class="btn danger" id="del">Supprimer</button>' : '') + '<span class="sp"></span><button type="button" class="btn" id="cancel">Annuler</button><button class="btn pri" type="submit">Enregistrer</button></footer></form>';
    document.body.appendChild(bg);
    var close = function () { bg.remove(); };
    bg.querySelector('.x').onclick = close; bg.querySelector('#cancel').onclick = close;
    bg.onclick = function (e) { if (e.target === bg) close(); };
    if (t.live) fields.forEach(function (c) { var el = bg.querySelector('#f_' + c.k); el.onchange = function () { var cur = read(); t.live(cur, c.k, DB, H); fields.forEach(function (f) { var e = bg.querySelector('#f_' + f.k); if (cur[f.k] != null && e !== el) e.value = cur[f.k]; }); }; });
    function read() { var o = Object.assign({}, r); fields.forEach(function (c) { var v = bg.querySelector('#f_' + c.k).value; o[c.k] = (c.type === 'money' || c.type === 'num') ? (v === '' ? '' : +v) : v.trim(); }); return o; }
    var d = bg.querySelector('#del');
    if (d) d.onclick = function () {
      if (d.dataset.sure) { DB[K(tk)] = DB[K(tk)].filter(function (x) { return x.id !== rec.id; }); if (t.onDelete) t.onDelete(rec, DB, H); save(); close(); toast('Supprimé.'); renderShell(); return; }
      d.dataset.sure = 1; d.textContent = 'Confirmer la suppression';
    };
    bg.querySelector('form').onsubmit = function (e) {
      e.preventDefault();
      var o = read(), miss = fields.filter(function (c) { return c.req && (o[c.k] === '' || o[c.k] == null); });
      if (miss.length) return toast('À remplir : ' + miss.map(function (c) { return c.label; }).join(', '), true);
      if (t.check) { var err = t.check(o, DB, H, rec); if (err) return toast(err, true); }
      if (isNew) { o.id = tk + '-' + Date.now(); DB[K(tk)].unshift(o); } else { DB[K(tk)] = DB[K(tk)].map(function (x) { return x.id === o.id ? o : x; }); }
      if (t.onSave) t.onSave(o, DB, H, rec);
      save(); close(); toast(isNew ? (t.savedNew || 'Ajouté.') : 'Modifications enregistrées.'); renderShell();
    };
    setTimeout(function () { var f = bg.querySelector('input,select'); if (f) f.focus(); }, 30);
  }

  load(); renderLogin();
})();

</script>
<script>
/* Bandeau « Démo » : identifiants de test, remplissage automatique et remise à zéro. */
(function () {
  var C = window.__DEMO || {};
  var host = document.createElement('div');
  host.id = 'ampandrana-demo-bar';
  var POS_OPEN = 'position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom, 0px));z-index:2147483000;width:max-content;max-width:calc(100vw - 24px)';
  var POS_MIN = 'position:fixed;left:50%;top:calc(6px + env(safe-area-inset-top, 0px));transform:translateX(-50%);z-index:2147483000;width:max-content;max-width:calc(100vw - 24px)';
  host.setAttribute('style', POS_OPEN);
  var root = host.attachShadow ? host.attachShadow({ mode: 'open' }) : host;
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var accounts = (C.accounts || []).map(function (a, i) {
    return '<li><div class="who"><b>' + esc(a.label) + '</b><span>' + esc(a.userLabel || 'Identifiant') + ' <code>' + esc(a.user) + '</code>' + (a.pass ? ' · ' + esc(a.passLabel || 'Mot de passe') + ' <code>' + esc(a.pass) + '</code>' : '') + '</span></div>' +
      (C.canFill && a.pass ? '<button type="button" data-fill="' + i + '">Utiliser</button>' : '') + '</li>';
  }).join('');
  root.innerHTML = '<style>' +
    ':host{all:initial}*{box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}' +
    '.bar{background:#10162B;color:#F2F4FA;border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);overflow:hidden}' +
    '.head{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px}' +
    '.back{color:#F2F4FA;text-decoration:none;font-weight:700;font-size:13px;padding:7px 10px;border-radius:10px;background:rgba(255,255,255,.1);white-space:nowrap}.back:hover{background:rgba(255,255,255,.18)}' +
    '.tag{background:#F47B0F;color:#1A0E02;font-weight:800;font-size:11px;letter-spacing:.08em;padding:3px 8px;border-radius:999px}' +
    '.title{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}' +
    'button{font:inherit;cursor:pointer;border-radius:10px;min-height:34px;padding:0 12px;font-size:13px;font-weight:700}' +
    '.tog{background:rgba(255,255,255,.1);color:#F2F4FA;border:0;margin-left:auto}' +
    '.body{padding:0 14px 14px;display:grid;gap:10px;max-width:440px}' +
    'ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}' +
    'li{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border-radius:12px;padding:8px 10px}' +
    '.who{display:grid;gap:2px;min-width:0;flex:1;font-size:12.5px;color:#C9D1E8}.who b{color:#fff;font-size:13px}' +
    'code{font-family:ui-monospace,Menlo,monospace;background:rgba(244,123,15,.18);color:#FFD2A8;padding:1px 6px;border-radius:6px;font-size:12.5px}' +
    'li button{background:#F47B0F;color:#1A0E02;border:0}' +
    'p{margin:0;font-size:12.5px;line-height:1.45;color:#C9D1E8}' +
    '.reset{background:transparent;color:#FFB4A8;border:1px solid rgba(255,180,168,.4);justify-self:start}' +
    'button:focus-visible{outline:2px solid #F47B0F;outline-offset:2px}' +
    '</style>' +
    '<div class="bar"><div class="head">' + (C.back ? '<a class="back" href="' + esc(C.back) + '">← Portfolio</a>' : '') + '<span class="tag">DÉMO</span><span class="title">' + esc(C.title || 'Version de démonstration') + '</span><button type="button" class="tog" aria-expanded="true">Réduire</button></div>' +
    '<div class="body"><p>' + esc(C.hint || 'Connectez-vous avec un compte de test.') + '</p><ul>' + accounts + '</ul>' +
    '<p>Tout ce que vous saisissez est effacé dès que vous vous déconnectez.</p>' +
    '<button type="button" class="reset">Effacer mes saisies et recommencer</button></div></div>';
  var body = root.querySelector('.body'), tog = root.querySelector('.tog');
  var title = root.querySelector('.title');
  var setOpen = function (open) { body.hidden = !open; body.style.display = open ? '' : 'none'; title.style.display = open ? '' : 'none'; tog.textContent = open ? 'Réduire' : 'Comptes de test'; tog.setAttribute('aria-expanded', String(open)); host.setAttribute('style', open ? POS_OPEN : POS_MIN); };
  tog.onclick = function (e) { e.stopPropagation(); setOpen(body.hidden); };
  /* Dès que le visiteur utilise le logiciel, le bandeau se range en haut de l'écran. */
  document.addEventListener('pointerdown', function (e) { if (!body.hidden && e.target !== host) setOpen(false); }, true);
  root.querySelector('.reset').onclick = function () { window.DEMO_LOGOUT(); };
  Array.prototype.forEach.call(root.querySelectorAll('[data-fill]'), function (b) {
    b.onclick = function () { var a = C.accounts[+b.dataset.fill]; try { window.DEMO_FILL && window.DEMO_FILL(a.user, a.pass); } catch (e) {} setOpen(false); };
  });
  var add = function () { document.body.appendChild(host); };
  if (document.body) add(); else document.addEventListener('DOMContentLoaded', add);
  /* L'application peut remplacer tout le contenu de la page : on remet le bandeau en place. */
  setInterval(function () { if (!host.isConnected && document.body) add(); }, 600);
})();

</script>
